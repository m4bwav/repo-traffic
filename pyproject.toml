[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "repo-traffic"
dynamic = ["version"]
description = "Save GitHub traffic (views, clones, referrers) and npm, NuGet and PyPI download counts before GitHub's 14-day window drops them"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Rogers" }]
keywords = ["github", "traffic", "downloads", "npm", "nuget", "pypi", "statistics", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
repo-traffic = "repo_traffic:cli"

[project.urls]
Homepage = "https://github.com/m4bwav/repo-traffic"
Documentation = "https://github.com/m4bwav/repo-traffic/wiki"
Changelog = "https://github.com/m4bwav/repo-traffic/blob/master/CHANGELOG.md"
Issues = "https://github.com/m4bwav/repo-traffic/issues"

[tool.hatch.version]
path = "repo_traffic.py"

[tool.hatch.build.targets.wheel]
only-include = ["repo_traffic.py"]

[tool.hatch.build.targets.sdist]
only-include = ["repo_traffic.py", "README.md", "LICENSE", "CHANGELOG.md", "repo_traffic.example.json"]

[tool.ruff]
line-length = 120
target-version = "py39"
# The golden recording and its harness are frozen since commit 896876d: never reformat them.
extend-exclude = ["tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["UP031", "UP032", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
include = ["repo_traffic.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
