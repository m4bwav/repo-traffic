# Every push and pull request: lint, size budget, build, the test matrix (unit and golden tests on three OSes from
# Python 3.9), and the built wheel installed in a fresh environment on each OS. The `ci` job is the required check.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint, build, size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_size.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.9', '3.14']
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.11'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: The recording still describes the frozen original on this OS
        run: python tests/golden/capture.py --check
      - run: python -m coverage run -m pytest
      - run: python -m coverage report

  package:
    name: installed wheel (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install the wheel in a fresh environment and run the golden test against the installed module
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/venv/Scripts"; fi
          "$bin/python" -m pip install dist/*.whl -r requirements-dev.txt
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' repo_traffic.py)
          test "$("$bin/repo-traffic" --version)" = "repo-traffic $version"
          installed=$(cd "$RUNNER_TEMP" && "$bin/python" -c "import repo_traffic; print(repo_traffic.__file__)")
          case "$installed" in *site-packages*) ;; *) echo "::error::not the installed module: $installed"; exit 1 ;; esac
          REPO_TRAFFIC_SCRIPT="$installed" "$bin/python" -m pytest tests/test_golden.py

  ci:
    name: ci
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then exit 1; fi
          done
